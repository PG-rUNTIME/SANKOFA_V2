

services:

  # ── PostgreSQL ──────────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: sankofa_db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-sankofa_db}
      POSTGRES_USER:     ${POSTGRES_USER:-sankofa}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sankofa_pass}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sankofa} -d ${POSTGRES_DB:-sankofa_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis (session cache / rate-limiting) ───────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: sankofa_redis
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  # ── Sankofa Application ─────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    container_name: sankofa_app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL:  "postgresql+asyncpg://${POSTGRES_USER:-sankofa}:${POSTGRES_PASSWORD:-sankofa_pass}@db:5432/${POSTGRES_DB:-sankofa_db}"
      REDIS_URL:     "redis://redis:6379/0"
      ENVIRONMENT:   "production"
      DEBUG:         "false"
    ports:
      - "8000:8000"
    volumes:
      - uploads:/tmp/sankofa_uploads
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  uploads:
    driver: local
